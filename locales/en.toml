# qdesk text — English

[meta]
name = "English"
code = "en"

[cli]
usage = """qdesk                 open the desktop
  -h, --help          this text
  -V, --version       print the version
On the desktop, ctrl+q quits."""
unknown-argument = "qdesk: unknown argument {argument}; see qdesk --help"

[dock]
# The marks of the workspaces beside the launcher button, and the number that stands for them on a
# narrow row.
workspace = "Workspace {n}"
workspace-next = "Workspace {n}; click for the next one"
# The clock when the local time zone is unknown: the time shown is UTC and says so.
clock-utc = "{time} UTC"
# Stands in for the machine name when the system gives none.
unknown-machine = "this machine"
launcher = "Applications"
# The control at the end of the dock that holds the windows that do not fit.
more = "More windows"

[screen]
too-small = "Terminal too small"
too-small-hint = "The desktop needs at least {columns} columns and {rows} rows."

[welcome]
# Shown once on an untouched desktop; {icon} is the launcher button's own glyph.
line = "The applications are behind {icon}, or ctrl alt space and then space."
close = "Got it"

[category]
system = "System"
development = "Development"
files = "Files"
network = "Network"
office = "Office"
media = "Media"
quvyta = "Quvyta"
other = "Other"

[launcher]
search = "Search"
close = "Close the launcher"
recents = "Recent"
all = "All"
installable = "Installable"
empty = "No applications yet"
empty-hint = "Entries live in ~/.local/share/quvyta/desktop/apps; installing a program adds one."
no-hits = "Nothing matches {query}"
no-hits-hint = "The search looks at names, descriptions and commands."
# The second line of a card whose program is not on this machine.
with-qpac = "install with qpac"
with-quvyta = "install with quvyta"
install-quvyta = "Run this to install {name}: {command}"
install-qpac = "Open qpac and install {package}; {name} appears here as soon as it is there."
menu-open = "Open {name}"
menu-install-qpac = "Install {name} with qpac"
menu-install-quvyta = "Install {name} with quvyta"
menu-add-icon = "Put {name} on the desktop"
menu-remove-icon = "Take {name} off the desktop"
hint-open = "open"
hint-add = "to the desktop"
hint-close = "close"

[icon]
open = "Open"
open-new = "Open in a new window"
rename = "Rename"
remove = "Remove from the desktop"
properties = "Properties"

[floor]
new-terminal = "New terminal"
new-folder = "New folder"
add-application = "Add an application"
arrange = "Arrange icons"
settings = "Settings"
# One line in place of the icons on a screen too narrow for them; {icon} is the launcher
# button's own glyph. The short form is used where the whole one does not fit.
narrow-hint = "Applications: {icon}, or ctrl alt space then space"
narrow-hint-short = "Applications: {icon}"
# In the help layer, beside shift and the arrows.
help-move = "Move the icon one cell"

[target]
# What the Terminal screen runs, where a command would be named.
shell = "your shell"

[properties]
built-in = "inside qdesk"
no-command = "a screen of qdesk"
body = "{id} — {file} — {command}"

[notice]
# An entry that opens a file: the viewers are not built yet, so nothing pretends to show it.
no-viewer = "{name} opens a file, and qdesk has no viewer for it yet"
# A program that could not be started at all: it is not there, or no pseudo-terminal was free.
start-failed = "{program} could not be started"
# The whole sentence: the system's words with the program they belong to.
start-failed-why = "{program} could not be started: {reason}"
install = "Installing {name}"
install-unknown = "{name} does not say how it is installed"
unsaved = "The desktop could not be saved"
# The list the dock's count opens. It holds this run's notifications and nothing older: it is
# forgotten when qdesk closes.
list = "Notifications"
list-empty = "Nothing has been said yet"
list-empty-hint = "A program that ends while you are elsewhere, a bell and a warning of qdesk's own come here."
# One row of it: what was said above, and the notification itself.
list-line = "{heading} — {body}"
# A notification a program sent with a title of its own: the title and then its words.
list-said = "{title}: {body}"
# A window rang the bell: it has no words of its own, so the list says what happened.
bell = "rang the bell"
# A paste that had nowhere to go: the window in front holds a program that has ended, and its last
# screen is there to be read, not typed into.
paste-nowhere = "This window's program has ended, so the pasted text went nowhere"

[window]
send-to = "Move to workspace {n}"
minimize = "Minimize"
maximize = "Maximize"
# Takes the window forward and lets the arrow keys size it.
resize = "Resize"
tile = "Tile the windows"
close = "Close"
restart = "Restart"
# The line a window shows once its program has ended.
ended = "The program ended, exit code {code}."
ended-signal = "The program was stopped before it could end."
# Closing a window whose program is still running.
close-title = "Close {name}?"
close-running = "{name} is still running. Closing the window ends it."
# Leaving qdesk while programs are running.
quit-title = "Quit qdesk?"
quit-running = { one = "{n} program is still running. Quitting ends it.", other = "{n} programs are still running. Quitting ends them." }
quit = "Quit"
tile-narrow = "The desktop is too narrow to tile windows side by side."
tile-short = "The desktop has room for {fits} tiled windows, no more."
# Said once, when the first window opens.
resize-hint = "Windows resize from their edges"
resize-hint-body = "Drag the right or the bottom edge, or the corner between them. Alt with the right button sizes a window from anywhere, and Resize in its menu on the dock does it with the arrow keys."

[mode]
# The dock's row while the keys are the desktop's.
pick = "window"
move = "move"
resize = "size"
maximize = "fill"
minimize = "dock"
close = "close"
tile = "tile"
launcher = "apps"
notices = "notices"
leave = "back"
back = "back"
release = "let go"
far = "{cells} at a time"
# The mouse sizes a window too: the key is what is dragged, the label what dragging it does.
drag = "edge"
drag-label = "drag it"
workspace = "spaces"

# The help layer names every key of qdesk by its action. The keys of desktop mode say so: they
# answer only while the desktop has them, and a line that did not say it would be a promise the
# key does not keep.
[keys]
workspace-1 = "Desktop mode: go to workspace 1"
workspace-2 = "Desktop mode: go to workspace 2"
workspace-3 = "Desktop mode: go to workspace 3"
workspace-4 = "Desktop mode: go to workspace 4"
send-to-1 = "Desktop mode: send the window to workspace 1"
send-to-2 = "Desktop mode: send the window to workspace 2"
send-to-3 = "Desktop mode: send the window to workspace 3"
send-to-4 = "Desktop mode: send the window to workspace 4"
launcher = "Open the launcher"
close = "Close what is open: the launcher, a list, then desktop mode"
desktop-mode = "Take the keys out of the window to the desktop, and back"
notices = "Desktop mode: the recent notifications"
window-move = "Desktop mode: the arrows move the window"
window-resize = "Desktop mode: the arrows size the window"
window-release = "Desktop mode: let go; the arrows pick windows again"
window-maximize = "Desktop mode: fill the desktop, or give the size back"
window-minimize = "Desktop mode: take the window down to the dock"
window-close = "Desktop mode: close the window"
window-tile = "Desktop mode: lay every window out at once"
window-left = "Desktop mode: pick, move or size to the left"
window-right = "Desktop mode: pick, move or size to the right"
window-up = "Desktop mode: pick, move or size upwards"
window-down = "Desktop mode: pick, move or size downwards"
window-left-far = "Desktop mode: five cells to the left"
window-right-far = "Desktop mode: five cells to the right"
window-up-far = "Desktop mode: five cells up"
window-down-far = "Desktop mode: five cells down"

# Keys of the floor itself, which are in no keymap: the help layer lists them under this screen.
[help]
icons-move = "Move between the icons"
icons-open = "Open the icon"
icons-clear = "Let go of the icons"
icons-jump = "a letter"
icons-jump-label = "Jump to the next icon that starts with it"

[expected]
string = "a string"
boolean = "true or false"
table = "a table"
text = "a string, or a table of strings by language"
string-list = "a list of strings"
size = "two whole numbers, columns and rows"

[diagnostic]
title-warning = "An entry has a warning"
title-error = "An entry could not be read"
at = "{place} — {what}"
unreadable = "This file could not be read."
not-utf8 = "This file is not written in UTF-8."
syntax = "This file is not valid TOML."
wrong-type = "{key} should hold {expected}."
invalid-value = "{key} holds a value that cannot be used."
missing-name = "This entry has no name."
missing-launch = "This entry has neither a command nor something to open."
conflicting-launch = "This entry says in more than one way what to open."
unknown-category = "There is no category called {value}; the entry went to Other."
unknown-field = "{key} is a field qdesk does not know; the entry is used without it."
no-home = "{key} starts with ~ and there is no home folder here."
malformed-line = "A line could not be read and was skipped."
missing-group = "This file has no [Desktop Entry] group."
missing-key = "This file has no {key} line."
bad-exec = "The Exec line cannot be read: a quote is unclosed or an escape is not allowed."
[settings]
store-failed = "The settings could not be written: {reason}"
file-problems = "Part of the settings file could not be read; what it says there is left as it is and the desktop uses what applies without it."
read = "Understood"

appearance = "Appearance"
language = "Language"
theme = "Theme"
glyphs = "Glyphs"
glyphs-text = "Every Quvyta application draws with these glyphs."
glyphs-auto = "Automatic"
glyphs-nerd = "Nerd Font"
glyphs-unicode = "Unicode"
glyphs-ascii = "Plain ASCII"

desktop = "Desktop"
dock = "Dock"
dock-text = "Which edge the row of open windows sits on."
dock-top = "Top"
dock-bottom = "Bottom"
floor-color = "Floor"
floor-color-text = "The colour behind the icons. Every tone is made of the theme's own colours; windows and the dock keep the theme."
floor-color-theme = "Theme"
floor-color-deep = "Deep"
floor-color-mist = "Mist"
floor-color-accent = "Accent"
floor-style = "Floor pattern"
floor-style-text = "Warming towards the accent at the bottom, a faint dot on the corners of the icon grid, or both."
floor-style-plain = "Plain"
floor-style-gradient = "Gradient"
floor-style-dots = "Dots"
# Gradient and dots together.
floor-style-gradient-dots = "Both"
folders-in-explorer = "Open folders with {program}"
folders-in-explorer-text = "A folder on the desktop or in Files opens in the ecosystem's file explorer. When {program} is not installed, Files opens instead."
status-strip = "Status on the dock"
status-strip-text = "The tmux sessions, the network, the processor, the memory and the battery beside the machine name. Off, the machine is not read for it."

connection = "Connection"
drag = "Dragging a window"
drag-live = "Live"
drag-ghost = "Ghost"
drag-in-force-live = "Here the window itself follows the mouse."
drag-in-force-ghost = "Here a shaded area follows the mouse and the window jumps to it; over SSH that is a great deal less to send."
frame-cap = "Frames a second"
frame-cap-automatic = "Automatic"
frame-cap-chosen = "A number"
frame-cap-frames = "Frames"
frame-cap-in-force = "Here the screen is drawn at most {frames} times a second. Typing never waits for it."
scrollback = "Remembered lines"
scrollback-text = "How many lines a terminal window keeps above its top edge. Many windows full of lines are many megabytes."

applications = "Applications"
folders = "Entries are read from these folders."
problems = "These could not be read and are not shown:"
no-problems = "Every entry was read"
no-problems-text = "Nothing in these folders was left out."

[files]
view-list = "Show as a list"
view-tree = "Show as a tree"
view-icons = "Show as icons"
open-new-window = "Open in a new window"
not-text = "{name} cannot be opened: its name is not text a program can be given"
open-with = "Open with"
open-with-editor = "{program}, your editor"
open-with-reader = "{program}, to read"

[status]
# The status strip on the dock's right side: short readings of the machine.
tmux = "tmux sessions"
network = "Network"
cpu = "Processor"
memory = "Memory"
battery = "Battery"
# A share in the strip, rounded: {value} is a whole number.
percent = "{value}%"
# Network rates in the strip, kept as short as they can be read: {value} is a number.
rate-bytes = "{value}B/s"
rate-kilo = "{value}K/s"
rate-mega = "{value}M/s"
rate-giga = "{value}G/s"

[power]
# The session actions at the foot of the launcher.
lock = "Lock"
log-out = "Log out"
restart = "Restart"
power-off = "Power off"
restart-title = "Restart this machine?"
restart-text = "Everything on it stops and starts again."
restart-running = { one = "{n} program is still running. Restarting ends it.", other = "{n} programs are still running. Restarting ends them." }
restart-failed = "The machine could not be restarted"
power-off-title = "Power off this machine?"
power-off-text = "Everything on it stops."
power-off-running = { one = "{n} program is still running. Powering off ends it.", other = "{n} programs are still running. Powering off ends them." }
power-off-failed = "The machine could not be powered off"
# Why a request to the system failed when the program said nothing about it.
exit-code = "It ended with code {code}."
killed = "It was stopped before it could answer."
# The lock screen. {user} is the login name whose password unlocks it.
lock-password = "Password for {user}"
lock-checking = "Checking…"
lock-wrong = "That is not the password. Try again."
lock-hint = "Type the password and press enter"

[widget]
# Widgets stand on the desktop floor beside the icons. The four kinds, in the floor's menu and
# the widget's own.
clock = "Clock"
calendar = "Calendar"
system = "System"
note = "Note"
# The floor's menu: a submenu of the four kinds, and one of the widgets already there.
add = "Add a widget"
remove-one = "Remove a widget"
# The last row of a widget's own menu.
remove = "Remove widget"
# The clock's options.
hours-24 = "24-hour clock"
hours-12 = "12-hour clock"
seconds = "Show seconds"
color = "Colour"
color-accent = "Accent"
color-text = "Plain"
color-gradient = "Gradient"
# Beside the digits of a 12-hour clock.
am = "AM"
pm = "PM"
# Under the clock's digits: {weekday} is the whole name of the day, {date} the day and the month
# as the language writes them.
clock-date = "{weekday}, {date}"
# The calendar's option, and its three choices.
week-start = "Week starts on"
week-start-language = "The language's day"
week-start-monday = "Monday"
week-start-sunday = "Sunday"
# In an empty note.
note-placeholder = "Write something"
# When a note cannot be read or written; the body names the file and the reason.
note-unsaved = "The note could not be saved"
# When the floor has no room left for a new widget; {name} is its kind.
no-room = "There is no room on the desktop for the {name} widget"
