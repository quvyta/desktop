[files]
view-list = "Mostrar como lista"
view-tree = "Mostrar como árbol"
view-icons = "Mostrar como iconos"
open-new-window = "Abrir en una ventana nueva"
not-text = "{name} no se puede abrir: su nombre no es texto que se pueda pasar a un programa"
