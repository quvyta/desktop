# 日本語

[meta]
name = "日本語"
code = "ja"
fallback = "en"

[cli]
usage = """
qdesk                 デスクトップを開く
  -h, --help          このテキストを表示
  -V, --version       バージョンを表示
qdesk wallpaper       背景の色、パターン、画像を表示
  --color NAME        色を設定: theme, deep, mist, accent
  --pattern NAME      パターンを設定: plain, gradient, dots, both
qdesk wallpaper FILE  背景に PNG、JPEG、GIF、WebP の画像を敷く
  --no-picture        画像を取り除く
デスクトップでは ctrl+q で終了します。"""
unknown-argument = "qdesk: 不明な引数 {argument} です。qdesk --help を参照してください"
wallpaper-color = "qdesk wallpaper: --color には theme, deep, mist, accent を指定してください。{value} は使えません"
wallpaper-pattern = "qdesk wallpaper: --pattern には plain, gradient, dots, both を指定してください。{value} は使えません"
wallpaper-missing = "qdesk wallpaper: {option} には値が必要です。qdesk --help を参照してください"
wallpaper-picture = "qdesk wallpaper: {file} は壁紙として使えません: {reason}"
wallpaper-not-text = "そのパスは設定ファイルに保存できるテキストではありません"
wallpaper-nowhere = "qdesk wallpaper: 設定を保存するホームフォルダがありません"
wallpaper-unsaved = "qdesk wallpaper: {file} を書き込めませんでした: {error}"

