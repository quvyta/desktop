list-empty-hint = "Ein Programm, das endet, während du woanders bist, eine Glocke und eine Warnung von qdesk selbst landen hier."
# One row of it: what was said above, and the notification itself.
list-line = "{heading} — {body}"
# A notification a program sent with a title of its own: the title and then its words.
list-said = "{title}: {body}"
# A window rang the bell: it has no words of its own, so the list says what happened.
bell = "hat die Glocke geläutet"
# A paste that had nowhere to go: the window in front holds a program that has ended, and its last
# screen is there to be read, not typed into.
paste-nowhere = "Das Programm dieses Fensters ist beendet, der eingefügte Text ging also ins Leere"

