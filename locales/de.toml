# Deutsch

[meta]
name = "Deutsch"
code = "de"
fallback = "en"

[cli]
usage = """
qdesk                 öffnet den Desktop
  -h, --help          dieser Text
  -V, --version       gibt die Version aus
qdesk wallpaper       zeigt Farbe, Muster und Bild des Bodens
  --color NAME        setzt die Farbe: theme, deep, mist oder accent
  --pattern NAME      setzt das Muster: plain, gradient, dots oder both
qdesk wallpaper FILE  legt ein PNG-, JPEG-, GIF- oder WebP-Bild auf den Boden
  --no-picture        nimmt das Bild weg
Auf dem Desktop beendet ctrl+q."""
unknown-argument = "qdesk: unbekanntes Argument {argument}; siehe qdesk --help"
wallpaper-color = "qdesk wallpaper: --color nimmt theme, deep, mist oder accent, nicht {value}"
wallpaper-pattern = "qdesk wallpaper: --pattern nimmt plain, gradient, dots oder both, nicht {value}"
wallpaper-missing = "qdesk wallpaper: {option} braucht einen Wert; siehe qdesk --help"
wallpaper-picture = "qdesk wallpaper: {file} kann nicht das Hintergrundbild sein: {reason}"
wallpaper-not-text = "sein Pfad ist kein Text, den die Einstellungsdatei speichern kann"
wallpaper-nowhere = "qdesk wallpaper: es gibt keinen Home-Ordner, um die Einstellung zu speichern"
wallpaper-unsaved = "qdesk wallpaper: {file} konnte nicht geschrieben werden: {error}"

