# qdesk metinleri — Türkçe

[meta]
name = "Türkçe"
code = "tr"

[cli]
usage = """qdesk                 masaüstünü açar
  -h, --help          bu yardımı gösterir
  -V, --version       sürümü yazar
qdesk wallpaper       zeminin rengini, desenini ve resmini yazar
  --color AD          rengi seçer: theme, deep, mist ya da accent
  --pattern AD        deseni seçer: plain, gradient, dots ya da both
qdesk wallpaper DOSYA zemine bir PNG, JPEG, GIF ya da WebP resmi serer
  --no-picture        resmi kaldırır
Masaüstündeyken ctrl+q ile çıkılır."""
unknown-argument = "qdesk: {argument} diye bir seçenek yok; seçenekler için qdesk --help"
wallpaper-color = "qdesk wallpaper: --color theme, deep, mist ya da accent olur; {value} olmaz"
wallpaper-pattern = "qdesk wallpaper: --pattern plain, gradient, dots ya da both olur; {value} olmaz"
wallpaper-missing = "qdesk wallpaper: {option} bir değer ister; seçenekler için qdesk --help"
wallpaper-picture = "qdesk wallpaper: {file} duvar kâğıdı olamaz: {reason}"
wallpaper-not-text = "yolu ayar dosyasının saklayabileceği bir metin değil"
wallpaper-nowhere = "qdesk wallpaper: ayarın saklanacağı bir ev klasörü yok"
