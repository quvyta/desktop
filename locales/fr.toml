# Français

[meta]
name = "Français"
code = "fr"
fallback = "en"

[cli]
usage = """
qdesk                 ouvrir le bureau
  -h, --help          ce texte
  -V, --version       afficher la version
qdesk wallpaper       afficher la couleur, le motif et l'image du fond
  --color NAME        régler la couleur : theme, deep, mist ou accent
  --pattern NAME      régler le motif : plain, gradient, dots ou both
qdesk wallpaper FILE  poser une image PNG, JPEG, GIF ou WebP sur le fond
  --no-picture        retirer l'image
Sur le bureau, ctrl+q quitte."""
unknown-argument = "qdesk : argument inconnu {argument} ; consultez qdesk --help"
wallpaper-color = "qdesk wallpaper : --color attend theme, deep, mist ou accent, et non {value}"
wallpaper-pattern = "qdesk wallpaper : --pattern attend plain, gradient, dots ou both, et non {value}"
wallpaper-missing = "qdesk wallpaper : {option} exige une valeur ; consultez qdesk --help"
wallpaper-picture = "qdesk wallpaper : {file} ne peut pas être le fond d'écran : {reason}"
wallpaper-not-text = "son chemin n'est pas du texte que le fichier de réglages peut conserver"
wallpaper-nowhere = "qdesk wallpaper : aucun dossier personnel où enregistrer le réglage"
wallpaper-unsaved = "qdesk wallpaper : impossible d'écrire {file} : {error}"

