# forgotten when qdesk closes.
list = "Notifications"
list-empty = "Rien n'a encore été dit"
list-empty-hint = "Un programme qui se termine pendant que vous êtes ailleurs, un bip et un avertissement de qdesk lui-même arrivent ici."
