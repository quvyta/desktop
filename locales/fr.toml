[files]
view-list = "Afficher en liste"
view-tree = "Afficher en arborescence"
view-icons = "Afficher en icônes"
open-new-window = "Ouvrir dans une nouvelle fenêtre"
not-text = "{name} ne peut pas être ouvert : son nom n'est pas un texte qu'on puisse donner à un programme"
