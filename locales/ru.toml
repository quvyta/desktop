# Русский

[meta]
name = "Русский"
code = "ru"
fallback = "en"

[cli]
usage = """
qdesk                 открыть рабочий стол
  -h, --help          этот текст
  -V, --version       показать версию
qdesk wallpaper       показать цвет, узор и картинку фона
  --color NAME        задать цвет: theme, deep, mist или accent
  --pattern NAME      задать узор: plain, gradient, dots или both
qdesk wallpaper FILE  положить картинку PNG, JPEG, GIF или WebP поверх фона
  --no-picture        убрать картинку
На рабочем столе ctrl+q завершает работу."""
unknown-argument = "qdesk: неизвестный аргумент {argument}; см. qdesk --help"
wallpaper-color = "qdesk wallpaper: --color принимает theme, deep, mist или accent, а не {value}"
wallpaper-pattern = "qdesk wallpaper: --pattern принимает plain, gradient, dots или both, а не {value}"
wallpaper-missing = "qdesk wallpaper: у {option} нет значения; см. qdesk --help"
wallpaper-picture = "qdesk wallpaper: {file} не может быть обоями: {reason}"
wallpaper-not-text = "его путь — не текст, который может хранить файл настроек"
wallpaper-nowhere = "qdesk wallpaper: нет домашней папки, чтобы сохранить настройку"
wallpaper-unsaved = "qdesk wallpaper: не удалось записать {file}: {error}"

